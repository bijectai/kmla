name: Native runtime baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-baseline:
    # GitHub documents ubuntu-latest as x64. The runtime probe also verifies it.
    # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KMLA_TZ: America/New_York
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Runtime regression tests
        run: python3 -B -m unittest discover -s scripts -p 'test_runtime*.py' -v

      - name: Build and record the approved native amd64 runtime
        timeout-minutes: 17
        env:
          RUN_DIR: ${{ runner.temp }}/runtime-baseline
        run: |
          set -euo pipefail
          mkdir -p "$RUN_DIR"
          bash harness/pin_runtime.sh --require-native --build-timeout 900 \
            --out "$RUN_DIR/RUNTIME.json" kmla-swipl:7.2.3

      - name: Assert 376 clean outcomes including two known vacuous cases
        timeout-minutes: 22
        env:
          RUN_DIR: ${{ runner.temp }}/runtime-baseline
        run: |
          set -euo pipefail
          bash harness/run_corpus.sh --require-native --case-timeout 120 --run-timeout 1200 \
            --runtime "$RUN_DIR/RUNTIME.json" --out "$RUN_DIR/BASELINE.json" "$GITHUB_WORKSPACE"

      - name: Report the measured baseline
        if: always()
        env:
          RUN_DIR: ${{ runner.temp }}/runtime-baseline
        run: |
          python3 -B - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUN_DIR']) / 'BASELINE.json'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              if not path.exists():
                  out.write('No completed runtime baseline. See retained build/measurement diagnostics.\n')
              else:
                  result = json.loads(path.read_text())
                  out.write(f"Baseline passed: {result['passed']}\n\n")
                  out.write(f"{result.get('clean_outcomes', 0)}/376 clean directive outcomes; "
                            "2 known vacuous cases (s3306_c_2_neg, s3306_c_2_pos), "
                            "374 nonvacuous cases. This is not 376 tested assertions or a parity verdict.\n\n")
                  out.write(f"Runtime identity SHA-256: {result.get('runtime_identity_sha256', 'unavailable')}\n")
          PY

      - name: Retain complete diagnostics and runtime identity even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-baseline/
          if-no-files-found: error
          retention-days: 90
