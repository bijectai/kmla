name: verify

# P-BUNDLE: human/ is tracked in this repository. CI detects manifest drift
# and PR changes without the owner label; it is not a branch-protection rule.

on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read

jobs:
  phase0:
    name: Phase 0 acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Protected-artifact manifest
        run: python3 -B scripts/human_manifest.py verify

      - name: Require installed manifest records
        run: |
          test -s human/HASHES.txt
          LC_ALL=C grep -Eq '^[0-9a-f]{64}  ' human/HASHES.txt

      - name: Phase 0 acceptance checks
        # The verifier treats a missing/empty protected manifest as a hard
        # failure. Other unavailable local-runtime prerequisites remain visible
        # here without making this workflow rebuild the separately pinned image.
        run: bash scripts/verify_phase0.sh .

      - name: Verifier enforcement regressions
        run: python3 -B scripts/test_verify_phase0.py

      - name: Runner boundary regressions
        run: |
          python3 -B scripts/test_runtime.py -v
          python3 -B scripts/test_runner_boundary.py -v

      - name: Install the pinned Lean toolchain
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          if ! command -v elan >/dev/null 2>&1; then
            curl -fsSL https://elan.lean-lang.org/elan-init.sh | \
              sh -s -- -y --default-toolchain none --no-modify-path
          fi
          test -s lean-toolchain
          toolchain="$(cat lean-toolchain)"
          elan toolchain install "$toolchain"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          echo "ELAN_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
          elan run "$toolchain" lean --version

      - name: Shared Interface guards
        run: bash scripts/check_interface.sh

      - name: Query-time guards
        run: bash scripts/check_query_time.sh

  protect-human:
    name: human/ is read-only to the assistant
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Refuse a pull request that modifies human/
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          OWNER_HUMAN_UPDATE: ${{ contains(github.event.pull_request.labels.*.name, 'owner-human-update') }}
        run: |
          set -euo pipefail
          # Compare the PR contribution from its merge base; --no-renames also
          # catches moves out of human/. An unavailable ref must fail closed.
          if git diff --quiet --no-ext-diff --no-renames "$BASE...$HEAD" -- human; then
            echo "No path under human/ is touched."
            exit 0
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              echo "::error::Cannot determine protected changes (git exit $status)."
              exit "$status"
            fi
          fi
          echo "This pull request modifies the protected tree:"
          git diff --no-ext-diff --no-renames --name-only "$BASE...$HEAD" -- human
          # This is the existing P-BUNDLE owner-label exception. A label never
          # bypasses the independent manifest-verification job.
          if [ "$OWNER_HUMAN_UPDATE" = true ]; then
            echo "Label 'owner-human-update' is present; allowing."
            exit 0
          fi
          echo "::error::human/ is owner-owned and read-only to the assistant"
          echo "::error::(docs/PLAN.md section 2, AGENTS.md). If this change is yours,"
          echo "::error::add the 'owner-human-update' label to this pull request."
          exit 1
